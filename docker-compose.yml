version: '3.8'

services:
  proxy:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://user:password@db:5432/proxydb?sslmode=disable
      - LOG_LEVEL=${LOG_LEVEL:-3}
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=proxydb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Initialize DB with a user
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
